name: Back-merge to dev

on:
    push:
        branches:
            - 'v[0-9]+.x'
            - 'v[0-9]+.X'

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: back-merge-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    back-merge:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: .github/scripts

            - uses: actions/github-script@v7
              with:
                  script: |
                      const release = require('./.github/scripts/release.js');
                      await release.backMerge({ github, context, core });